<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no" />
<title>Car Thing · Now Playing — design options</title>
<style>
  /* ---- Chromium-69 safe: no oklch, no flex gap, no aspect-ratio, no backdrop-filter ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 800px; height: 480px; overflow: hidden; background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", system-ui, "DejaVu Sans", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .stage { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .design { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; }
  .design.active { display: block; }
  svg { display: block; }
  .icon { width: 26px; height: 26px; fill: currentColor; }
  .btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    border: none; background: transparent; color: inherit; }

  /* HUD: which design + presets */
  .hud { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    display: flex; align-items: center; z-index: 50; padding: 5px 12px; border-radius: 999px;
    background: rgba(0,0,0,.45); font-size: 12px; letter-spacing: .04em; color: rgba(255,255,255,.85); }
  .hud b { font-weight: 700; }
  .hud .sep { opacity: .4; margin: 0 8px; }
  .hud .num { display: inline-flex; width: 18px; height: 18px; margin-right: 6px; border-radius: 6px;
    align-items: center; justify-content: center; background: rgba(255,255,255,.14); font-weight: 700; }

  /* ============================ D1 · AURORA (refined, Spotify-native) ============================ */
  .d1 { background: #0b0d12; }
  .d1 .bg { position: absolute; top: -60px; right: -60px; bottom: -60px; left: -60px; background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.4) brightness(.7); transform: scale(1.2); }
  .d1 .scrim { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(120deg, rgba(8,10,15,.92) 30%, rgba(8,10,15,.55) 100%); }
  .d1 .wrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; padding: 34px 40px; }
  .d1 .left { width: 232px; flex: none; display: flex; flex-direction: column; }
  .d1 .cover { width: 188px; height: 188px; border-radius: 14px; object-fit: cover;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  .d1 .title { margin-top: 20px; font-size: 25px; font-weight: 800; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1 .artist { margin-top: 3px; font-size: 16px; color: rgba(255,255,255,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1 .bar { margin-top: 18px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .d1 .bar > i { display: block; height: 100%; background: #1ed760; border-radius: 99px; }
  .d1 .times { margin-top: 7px; display: flex; justify-content: space-between; font-size: 12px;
    color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
  .d1 .ctl { margin-top: 20px; display: flex; align-items: center; justify-content: center; }
  .d1 .ctl .btn { color: rgba(255,255,255,.85); }
  .d1 .ctl .side { width: 48px; height: 48px; }
  .d1 .ctl .play { width: 60px; height: 60px; margin: 0 16px; border-radius: 99px; background: #fff; color: #07120b; }
  .d1 .ctl .play .icon { width: 28px; height: 28px; }
  .d1 .lyrics { flex: 1; margin-left: 30px; position: relative; overflow: hidden; mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent); }
  .d1 .lyrics .scroll { position: absolute; left: 0; right: 0; transition: transform .4s ease; }
  .d1 .lyrics p { font-size: 20px; line-height: 1.5; padding: 4px 0; color: rgba(255,255,255,.32); transition: color .3s, font-weight .3s; }
  .d1 .lyrics p.on { color: #fff; font-weight: 700; }

  /* ============================ D2 · MONOLITH (editorial / typographic) ============================ */
  .d2 { background: #0a0a0a; }
  .d2 .wrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 40px 44px 30px; }
  .d2 .top { display: flex; align-items: flex-start; }
  .d2 .cover { width: 96px; height: 96px; flex: none; object-fit: cover; border-radius: 2px; filter: grayscale(.15); }
  .d2 .head { margin-left: 22px; flex: 1; min-width: 0; }
  .d2 .kicker { font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: #ff5128; font-weight: 700; }
  .d2 .title { margin-top: 8px; font-size: 46px; line-height: .96; font-weight: 800; letter-spacing: -.03em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d2 .artist { margin-top: 10px; font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .d2 .rule { margin: 22px 0 18px; height: 1px; background: rgba(255,255,255,.14); }
  .d2 .lyrics { flex: 1; overflow: hidden; position: relative; }
  .d2 .lyrics .scroll { position: absolute; left: 0; right: 0; transition: transform .4s ease; }
  .d2 .lyrics p { font-size: 26px; line-height: 1.34; font-weight: 600; letter-spacing: -.01em; color: rgba(255,255,255,.2); transition: color .3s; }
  .d2 .lyrics p.on { color: #fff; }
  .d2 .foot { display: flex; align-items: center; margin-top: 14px; }
  .d2 .pbar { flex: 1; height: 2px; background: rgba(255,255,255,.16); position: relative; }
  .d2 .pbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: #ff5128; }
  .d2 .time { margin-left: 16px; font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.5);
    font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace; }
  .d2 .ctl { margin-left: 18px; display: flex; align-items: center; }
  .d2 .ctl .btn { width: 36px; height: 36px; color: rgba(255,255,255,.85); }
  .d2 .ctl .icon { width: 22px; height: 22px; }

  /* ============================ D3 · IMMERSE (full-bleed cinematic) ============================ */
  .d3 .bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-size: cover; background-position: center; }
  .d3 .grad { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background:
      radial-gradient(120% 90% at 50% 8%, rgba(0,0,0,0) 38%, rgba(0,0,0,.5) 100%),
      linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.1) 35%, rgba(0,0,0,.85)); }
  .d3 .lyricwrap { position: absolute; left: 0; right: 0; top: 96px; bottom: 150px; overflow: hidden;
    mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }
  .d3 .scroll { position: absolute; left: 0; right: 0; text-align: center; transition: transform .45s ease; }
  .d3 .scroll p { font-size: 30px; line-height: 1.32; font-weight: 700; letter-spacing: -.015em; padding: 6px 60px;
    color: rgba(255,255,255,.32); text-shadow: 0 2px 18px rgba(0,0,0,.5); transition: color .3s, opacity .3s; }
  .d3 .scroll p.on { color: #fff; }
  .d3 .info { position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; align-items: center; }
  .d3 .meta { flex: 1; min-width: 0; }
  .d3 .title { font-size: 27px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  .d3 .artist { margin-top: 2px; font-size: 15px; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d3 .ctl { display: flex; align-items: center; margin-left: 18px; }
  .d3 .ctl .btn { color: #fff; }
  .d3 .ctl .side { width: 46px; height: 46px; }
  .d3 .ctl .play { width: 58px; height: 58px; margin: 0 10px; border-radius: 99px;
    background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.5); }
  .d3 .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); }
  .d3 .pbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }

  /* ============================ D4 · HI-FI (tactile / industrial, amber) ============================ */
  .d4 { background:
      radial-gradient(140% 100% at 12% 0%, #1a1714 0%, #100f0d 48%, #0a0908 100%); }
  .d4 .wrap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; padding: 0 44px; }
  .d4 .dial { position: relative; width: 220px; height: 220px; flex: none; }
  .d4 .dial svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .d4 .dial .cover { position: absolute; left: 26px; top: 26px; width: 168px; height: 168px; border-radius: 99px;
    object-fit: cover; box-shadow: inset 0 0 0 6px #0a0908, 0 10px 30px rgba(0,0,0,.55); }
  .d4 .dial .hole { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 99px; background: #0a0908; box-shadow: 0 0 0 4px rgba(255,176,79,.18); }
  .d4 .right { flex: 1; margin-left: 44px; }
  .d4 .tag { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: #ffb04f;
    font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace; }
  .d4 .title { margin-top: 12px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d4 .artist { margin-top: 5px; font-size: 16px; color: rgba(255,255,255,.55); }
  .d4 .meterrow { margin-top: 20px; display: flex; align-items: center; }
  .d4 .meter { flex: 1; height: 8px; border-radius: 2px; background: #0a0908; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); overflow: hidden; }
  .d4 .meter > i { display: block; height: 100%; background: linear-gradient(90deg, #ffb04f, #ff7a1a); }
  .d4 .clock { margin-left: 16px; font-size: 13px; color: #ffb04f; letter-spacing: .08em;
    font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace; }
  .d4 .ctl { margin-top: 24px; display: flex; align-items: center; }
  .d4 .ctl .btn { width: 54px; height: 54px; border-radius: 12px; background: #17140f; color: #ffcf93;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 4px rgba(0,0,0,.5); }
  .d4 .ctl .btn + .btn { margin-left: 14px; }
  .d4 .ctl .play { background: #ffb04f; color: #1a1206; }
</style>
</head>
<body>
  <div class="stage">
    <!-- D1 -->
    <section class="design d1" data-name="Aurora">
      <div class="bg" data-art></div><div class="scrim"></div>
      <div class="wrap">
        <div class="left">
          <img class="cover" data-art-img alt="" />
          <div class="title" data-title></div>
          <div class="artist" data-artist></div>
          <div class="bar"><i data-prog></i></div>
          <div class="times"><span data-pos></span><span data-dur></span></div>
          <div class="ctl">
            <button class="btn side" data-act="previous"></button>
            <button class="btn play" data-act="playpause" data-play></button>
            <button class="btn side" data-act="next"></button>
          </div>
        </div>
        <div class="lyrics" data-lyrics><div class="scroll"></div></div>
      </div>
    </section>

    <!-- D2 -->
    <section class="design d2" data-name="Monolith">
      <div class="wrap">
        <div class="top">
          <img class="cover" data-art-img alt="" />
          <div class="head">
            <div class="kicker">Now Playing</div>
            <div class="title" data-title></div>
            <div class="artist" data-artist></div>
          </div>
        </div>
        <div class="rule"></div>
        <div class="lyrics" data-lyrics><div class="scroll"></div></div>
        <div class="foot">
          <div class="pbar"><i data-prog></i></div>
          <div class="time"><span data-pos></span> / <span data-dur></span></div>
          <div class="ctl">
            <button class="btn" data-act="previous"></button>
            <button class="btn" data-act="playpause" data-play></button>
            <button class="btn" data-act="next"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- D3 -->
    <section class="design d3" data-name="Immerse">
      <div class="bg" data-art></div><div class="grad"></div>
      <div class="lyricwrap" data-lyrics><div class="scroll"></div></div>
      <div class="info">
        <div class="meta">
          <div class="title" data-title></div>
          <div class="artist" data-artist></div>
        </div>
        <div class="ctl">
          <button class="btn side" data-act="previous"></button>
          <button class="btn play" data-act="playpause" data-play></button>
          <button class="btn side" data-act="next"></button>
        </div>
      </div>
      <div class="pbar"><i data-prog></i></div>
    </section>

    <!-- D4 -->
    <section class="design d4" data-name="Hi-Fi">
      <div class="wrap">
        <div class="dial">
          <svg viewBox="0 0 220 220" data-ring>
            <circle cx="110" cy="110" r="104" fill="none" stroke="#0a0908" stroke-width="9"/>
            <circle cx="110" cy="110" r="104" fill="none" stroke="#ffb04f" stroke-width="9"
              stroke-linecap="round" transform="rotate(-90 110 110)" data-arc/>
          </svg>
          <img class="cover" data-art-img alt="" />
          <div class="hole"></div>
        </div>
        <div class="right">
          <div class="tag">◈ Spotify · Hi-Fi</div>
          <div class="title" data-title></div>
          <div class="artist" data-artist></div>
          <div class="meterrow">
            <div class="meter"><i data-prog></i></div>
            <div class="clock"><span data-pos></span> · <span data-dur></span></div>
          </div>
          <div class="ctl">
            <button class="btn" data-act="previous"></button>
            <button class="btn play" data-act="playpause" data-play></button>
            <button class="btn" data-act="next"></button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="hud"><span class="num" data-hudnum>1</span><b data-hudname>Aurora</b>
    <span class="sep">·</span>press 1–4 to switch</div>

<script>
(function () {
  // ---- monochrome SVG media icons (currentColor) ----
  var ICON = {
    previous: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>',
    next: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>',
    play: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
  };

  var MOCK = {
    title: "Blinding Lights", artist: "The Weeknd", durationSec: 200, positionSec: 82, volume: 60,
    state: "playing",
    art: "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640"><defs>' +
      '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#e23b4e"/><stop offset="0.55" stop-color="#7a1f3d"/><stop offset="1" stop-color="#171a2e"/>' +
      '</linearGradient></defs><rect width="640" height="640" fill="url(#g)"/>' +
      '<circle cx="470" cy="180" r="150" fill="rgba(255,255,255,0.10)"/>' +
      '<rect x="0" y="430" width="640" height="210" fill="rgba(0,0,0,0.18)"/></svg>'),
    lyrics: [
      { t: 70, text: "I look around and" }, { t: 73, text: "Sin City's cold and empty" },
      { t: 76, text: "No one's around to judge me" }, { t: 79, text: "I can't see clearly when you're gone" },
      { t: 83, text: "I said, ooh, I'm blinded by the lights" }, { t: 89, text: "No, I can't sleep until I feel your touch" },
      { t: 95, text: "I said, ooh, I'm drowning in the night" }, { t: 101, text: "Oh, when I'm like this, you're the one I trust" },
      { t: 107, text: "Hey, hey, hey" }
    ]
  };

  var data = MOCK, posBase = { p: 0, at: Date.now() };

  function mmss(s) { s = Math.max(0, Math.floor(s)); var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" + r : r); }
  function pos() { return data.state === "playing" ? posBase.p + (Date.now() - posBase.at) / 1000 : posBase.p; }

  function fillStatic() {
    var art = data.art;
    document.querySelectorAll("[data-art]").forEach(function (e) { e.style.backgroundImage = 'url("' + art + '")'; });
    document.querySelectorAll("[data-art-img]").forEach(function (e) { e.src = art; });
    document.querySelectorAll("[data-title]").forEach(function (e) { e.textContent = data.title; });
    document.querySelectorAll("[data-artist]").forEach(function (e) { e.textContent = data.artist; });
    document.querySelectorAll("[data-dur]").forEach(function (e) { e.textContent = mmss(data.durationSec); });
    document.querySelectorAll('[data-act]').forEach(function (b) { b.innerHTML = ICON[b.getAttribute("data-act") === "playpause" ? "pause" : b.getAttribute("data-act")]; });
    // lyrics nodes
    document.querySelectorAll("[data-lyrics] .scroll").forEach(function (sc) {
      sc.innerHTML = "";
      (data.lyrics || []).forEach(function (l, i) { var p = document.createElement("p"); p.textContent = l.text || "♪"; p.setAttribute("data-i", i); sc.appendChild(p); });
    });
    // d4 ring length
    var R = 104, C = 2 * Math.PI * R;
    document.querySelectorAll("[data-arc]").forEach(function (a) { a.style.strokeDasharray = C; });
  }

  function tick() {
    var p = pos(), pct = data.durationSec > 0 ? Math.min(100, p / data.durationSec * 100) : 0;
    document.querySelectorAll("[data-prog]").forEach(function (e) { e.style.width = pct + "%"; });
    document.querySelectorAll("[data-pos]").forEach(function (e) { e.textContent = mmss(p); });
    var C = 2 * Math.PI * 104;
    document.querySelectorAll("[data-arc]").forEach(function (a) { a.style.strokeDashoffset = C * (1 - pct / 100); });
    document.querySelectorAll("[data-play]").forEach(function (b) { b.innerHTML = ICON[data.state === "playing" ? "pause" : "play"]; });
    // active lyric per visible design
    var lines = data.lyrics || [], act = -1;
    for (var i = 0; i < lines.length; i++) { if (lines[i].t <= p + 0.2) act = i; else break; }
    document.querySelectorAll(".design.active [data-lyrics]").forEach(function (box) {
      var sc = box.querySelector(".scroll"); if (!sc) return;
      var ps = sc.querySelectorAll("p");
      for (var j = 0; j < ps.length; j++) { if (j === act) ps[j].className = "on"; else ps[j].className = ""; }
      if (act >= 0 && ps[act]) { sc.style.transform = "translateY(" + (box.clientHeight / 2 - ps[act].offsetTop - ps[act].clientHeight / 2) + "px)"; }
    });
  }

  // ---- design switching ----
  var designs = document.querySelectorAll(".design"), cur = 0;
  function setDesign(n) {
    cur = (n + designs.length) % designs.length;
    for (var i = 0; i < designs.length; i++) {
      if (i === cur) designs[i].classList.add("active");
      else designs[i].classList.remove("active");
    }
    document.querySelector("[data-hudnum]").textContent = cur + 1;
    document.querySelector("[data-hudname]").textContent = designs[cur].getAttribute("data-name");
    tick();
  }
  window.setDesign = setDesign;

  // keyboard (Mac preview) + on-device preset buttons (8890) + transport clicks
  window.addEventListener("keydown", function (e) { if (e.key >= "1" && e.key <= "4") setDesign(+e.key - 1); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act");
    if (a === "playpause") { data.state = data.state === "playing" ? "paused" : "playing"; posBase = { p: pos(), at: Date.now() }; tick(); }
    try { fetch("/state"); } catch (_) {}
    sendControl(a);
  });
  function sendControl(a) { try { var ws = window.__ctl; if (ws && ws.readyState === 1) { /* feeder media.control */ } } catch (_) {} }

  function connectButtons() {
    try {
      var ws = new WebSocket("ws://localhost:8890");
      ws.onmessage = function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (_) { return; }
        var t = m && m.type ? String(m.type) : "";
        if (t.indexOf("preset_") === 0) { var n = parseInt(t.slice(7), 10); if (n >= 1 && n <= 4) setDesign(n - 1); }
      };
      ws.onclose = function () { setTimeout(connectButtons, 2000); };
    } catch (_) { setTimeout(connectButtons, 2000); }
  }

  // ---- live data from the feeder (falls back to MOCK) ----
  function loadLive() {
    fetch("/state").then(function (r) { return r.json(); }).then(function (s) {
      var np = s && s.nowPlaying;
      if (np && np.state !== "stopped" && np.title) {
        data = {
          title: np.title, artist: np.artist, durationSec: np.durationSec, volume: np.volume, state: np.state,
          art: np.artworkUrl ? "/api/artwork?u=" + encodeURIComponent(np.artworkUrl) : MOCK.art,
          lyrics: (np.lyrics && np.lyrics.length) ? np.lyrics : MOCK.lyrics
        };
        posBase = { p: np.positionSec, at: Date.now() };
        fillStatic();
      }
    }).catch(function () {});
  }

  fillStatic();
  setDesign(0);
  connectButtons();
  loadLive();
  setInterval(loadLive, 4000);
  setInterval(tick, 250);
})();
</script>
</body>
</html>
